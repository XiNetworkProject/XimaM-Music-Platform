name: Native app check

on:
  push:
    paths:
      - 'synaura-app/**'
      - '.github/workflows/native-app-check.yml'
  pull_request:
    paths:
      - 'synaura-app/**'
      - '.github/workflows/native-app-check.yml'

jobs:
  typecheck:
    name: Expo TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synaura-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: synaura-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check native app
        run: npm run type-check

      - name: Check responsive contracts
        run: npm run check:responsive

      - name: Check theme integrity
        run: npm run check:theme
