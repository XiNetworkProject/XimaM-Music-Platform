# Configuration adaptee a la production Debian 12 constatee le 7 septembre 2026.

server {
    listen 80;
    listen [::]:80;
    server_name synaura.fr www.synaura.fr;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name preview.synaura.fr;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name media.synaura.fr;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name synaura.fr www.synaura.fr;
    ssl_certificate /etc/letsencrypt/live/synaura.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synaura.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 500M;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ^~ /debug { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name preview.synaura.fr;
    ssl_certificate /etc/letsencrypt/live/preview.synaura.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.synaura.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 500M;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ^~ /debug { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.synaura.fr;
    ssl_certificate /etc/letsencrypt/live/media.synaura.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.synaura.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /mnt/Synaura-SSD/apps/synaura/media;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;
    disable_symlinks on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ (^|/)\. { return 404; }
    location ~ ^/cloudinary/_ { return 404; }

    location = /mobile-releases/latest.json {
        try_files $uri =404;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # publish-android-release.js impose synaura-<version>-<versionCode>.apk.
    location ~ ^/mobile-releases/apks/synaura-[0-9][0-9A-Za-z._-]*-[0-9]+\.apk$ {
        try_files $uri =404;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location /mobile-releases/ { return 404; }

    location ~ ^/(cloudinary|audio|covers|avatars|banners|profiles|posts|messages|clips|ai|star-academy|editorial|weather)/ {
        try_files $uri =404;
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location / { return 404; }
}
