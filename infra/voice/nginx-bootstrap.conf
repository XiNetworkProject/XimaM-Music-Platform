# Additive vhost only. Existing application HTTPS routing is unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name voice.synaura.fr turn.synaura.fr;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/synaura-voice-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
