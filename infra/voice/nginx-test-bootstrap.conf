server {
    listen 80;
    listen [::]:80;
    server_name voice-test.synaura.fr;
    access_log off;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/synaura-voice-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
