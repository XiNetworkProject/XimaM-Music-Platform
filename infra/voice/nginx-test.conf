# Temporary preview only; canonical production and LiveKit vhosts unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name voice-test.synaura.fr;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/synaura-voice-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://voice-test.synaura.fr$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voice-test.synaura.fr;
    ssl_certificate /etc/letsencrypt/live/synaura-voice-test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synaura-voice-test/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/synaura-voice-test-error.log crit;
    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    # Private preview responses, including RSC, may never enter a shared cache.
    add_header Cache-Control "private, no-store" always;
    location / {
        proxy_pass http://127.0.0.1:13331;
        proxy_http_version 1.1;
        proxy_set_header Host voice-test.synaura.fr;
        proxy_set_header X-Forwarded-Host voice-test.synaura.fr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header x-middleware-subrequest "";
        proxy_set_header x-middleware-invoke "";
        proxy_set_header x-invoke-path "";
        proxy_set_header x-invoke-query "";
        proxy_set_header x-invoke-status "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 3s;
        proxy_read_timeout 65s;
        proxy_buffering off;
    }
}
