# Do not move or replace existing nginx listeners/vhosts.
map $http_upgrade $synaura_voice_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    listen [::]:80;
    server_name voice.synaura.fr turn.synaura.fr;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/synaura-voice-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voice.synaura.fr;
    ssl_certificate /etc/letsencrypt/live/synaura-voice/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synaura-voice/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    # LiveKit uses a query token for WS. Never log the query string.
    access_log off;
    error_log /var/log/nginx/synaura-voice-error.log crit;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    location = /healthz {
        proxy_pass http://127.0.0.1:7880/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    location = /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $synaura_voice_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
    location = /rtc/validate {
        proxy_pass http://127.0.0.1:7880;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Current clients try v1 first. Preserve upstream status and CORS headers
    # so older servers can request the SDK's supported /rtc fallback.
    location = /rtc/v1 {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $synaura_voice_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
    location = /rtc/v1/validate {
        proxy_pass http://127.0.0.1:7880;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Room administration, agents, ingress and debugging stay local-only.
    location / { return 404; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turn.synaura.fr;
    ssl_certificate /etc/letsencrypt/live/synaura-voice/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synaura-voice/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    access_log off;
    # Reservation only: HTTPS is NOT TURN/TLS. Do not advertise it as such.
    location / { return 404; }
}
